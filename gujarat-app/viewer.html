<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gujarat 2027 - Map Viewer</title>
  
  <!-- MapLibre CSS -->
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navigation Header with Theme Toggle Button -->
  <header class="header-container" style="display: flex; align-items: center; justify-content: space-between; padding: 1rem;">
    <h1>GUJARAT 2027</h1>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme" style="margin-left: auto; cursor: pointer; background: none; border: none; font-size: 1.2rem;">
      <span id="theme-icon">🌙</span>
    </button>
  </header>

  <!-- Main Content Layout with the 3 Map Views -->
  <main class="dashboard-container" style="padding: 1rem;">
    
    <div class="map-card" style="margin-bottom: 2rem; padding: 1rem; border: 1px solid #ccc; border-radius: 8px;">
      <h3>Constituency View</h3>
      <div id="map-constituency" class="map-container"></div>
    </div>

    <div class="map-card" style="margin-bottom: 2rem; padding: 1rem; border: 1px solid #ccc; border-radius: 8px;">
      <h3>District View</h3>
      <div id="map-district" class="map-container"></div>
    </div>

    <div class="map-card" style="margin-bottom: 2rem; padding: 1rem; border: 1px solid #ccc; border-radius: 8px;">
      <h3>Taluka View</h3>
      <div id="map-taluka" class="map-container"></div>
    </div>

  </main>

  <!-- MapLibre JS Library -->
  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
  
  <!-- Your App Script -->
  <script src="app.js"></script>
</body>
</html>
