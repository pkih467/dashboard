<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gujarat 2027 - GIS Navigation</title>
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header-container" style="padding: 1rem; border-bottom: 1px solid var(--border-color);">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem;">
      <div>
        <h1 style="margin: 0; font-size: 1.5rem;">GUJARAT 2027</h1>
        <p style="margin: 0; font-size: 0.85rem; opacity: 0.8;">State Dashboard For Campaign</p>
      </div>
      <div class="header-actions" style="display: flex; gap: 0.8rem;">
        <button id="theme-toggle" style="cursor:pointer; background:none; border:none; font-size:1.2rem;">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
    <nav class="nav-tabs" style="display: flex; gap: 0.5rem; overflow-x: auto;">
      <button class="tab-btn" data-target="home-section" style="padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer;">🏠 Home</button>
      <button class="tab-btn active" data-target="map-section" style="padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; font-weight: bold;">🗺️ Map</button>
      <button class="tab-btn" data-target="results-section" style="padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer;">🎯 Seats</button>
    </nav>
  </header>

  <main class="dashboard-container">
    <!-- MAP SECTION -->
    <div id="map-section" class="content-section" style="display: block;">
      
      <!-- Full Screen Map Canvas -->
      <div id="map-container" class="map-container"></div>

      <!-- Parallel Dropdowns Control Panel (Floating Top Right) -->
      <div class="map-control-card">
        <div style="display: flex; flex-direction: column; justify-content: center; gap: 2px;">
           <span style="font-weight: 800; font-size: 12px; color: #007AFF; text-transform: uppercase;">📍 GUJARAT GIS</span>
        </div>

        <div class="dropdown-group">
          <label>Assembly</label>
          <select id="filter-assembly" class="state-select"></select>
        </div>

        <div class="dropdown-group">
          <label>District</label>
          <select id="filter-district" class="state-select"></select>
        </div>

        <div class="dropdown-group">
          <label>Taluka</label>
          <select id="filter-taluka" class="state-select"></select>
        </div>

        <button class="fullscreen-map-btn" onclick="resetFiltersAndMap()" title="Reset Filters & Zoom Out">⛶</button>
      </div>
    </div>

    <!-- HOME SECTION -->
    <div id="home-section" class="content-section" style="display: none; padding: 20px;">
      <h2>Home Dashboard</h2>
      <p>Home tab is sealed.</p>
    </div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
