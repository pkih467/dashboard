<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gujarat 2027 - GIS Map Navigation</title>
  
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header-container" style="padding: 1rem;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem;">
      <div>
        <h1 style="margin: 0; font-size: 1.5rem;">GUJARAT 2027</h1>
        <p style="margin: 0; font-size: 0.85rem; opacity: 0.8;">Booth-Up Operations & Campaign</p>
      </div>
      
      <div class="header-actions" style="display: flex; align-items: center; gap: 0.8rem;">
        <button id="theme-toggle" style="cursor: pointer; background: none; border: none; font-size: 1.2rem;" title="Toggle Day/Night Mode">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>

    <nav class="nav-tabs" style="display: flex; gap: 0.5rem; overflow-x: auto;">
      <button class="tab-btn" data-target="home-section" style="padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer;">🏠 Home</button>
      <button class="tab-btn active" data-target="map-section" style="padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; font-weight: bold;">🗺️ Map</button>
    </nav>
  </header>

  <main class="dashboard-container">
    <!-- MAP SECTION -->
    <div id="map-section" class="content-section">
      <!-- Full Screen MapLibre Canvas -->
      <div id="map-container" class="map-container"></div>

      <!-- Floating Control Panel with Side-by-Side Dropdowns on the Right -->
      <div class="map-control-card">
        <div class="map-control-header">
          <span>📍 Gujarat Map</span>
          <button class="fullscreen-map-btn" onclick="resetGujaratBounds()" title="Reset to Full Screen Gujarat">⛶</button>
        </div>

        <div class="dropdowns-wrapper">
          <div class="dropdown-group">
            <label>Assembly (182)</label>
            <select id="filter-assembly" class="state-select">
              <option value="">-- Choose Assembly --</option>
            </select>
          </div>

          <div class="dropdown-group">
            <label>District (33)</label>
            <select id="filter-district" class="state-select">
              <option value="">-- Choose District --</option>
            </select>
          </div>

          <div class="dropdown-group">
            <label>Taluka</label>
            <select id="filter-taluka" class="state-select">
              <option value="">-- Choose Taluka --</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- HOME SECTION PLACEHOLDER -->
    <div id="home-section" class="content-section" style="display: none; padding: 2rem;">
      <h2>Home Dashboard</h2>
      <p>Home tab components are sealed and locked.</p>
    </div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
