  <!-- TAB 1: Map -->
  <div id="section-1" class="app-section">
    <div id="maplibre-container">
      <div class="map-control-card">
        <div class="dropdown-group">
          <label>District</label>
          <select id="filter-district" class="state-select">
            <option value="">-- All Districts --</option>
          </select>
        </div>
        <div class="dropdown-group">
          <label>Assembly Constituency</label>
          <select id="filter-assembly" class="state-select">
            <option value="">-- All Seats --</option>
          </select>
        </div>
        
        <!-- BOUNDARY TOGGLES -->
        <div style="margin-top: 16px; border-top: 2px solid var(--border-color); padding-top: 12px;">
          <label style="font-size: 10px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.6px;">Boundaries</label>
          <div class="boundary-toggles" style="margin-top: 8px;">
            <button class="boundary-chip" data-layer="districts">District Boundaries</button>
            <button class="boundary-chip" data-layer="assembly">Assembly Constituency</button>
            <button class="boundary-chip" data-layer="talukas">Taluka Boundaries</button>
            <button class="boundary-chip" data-layer="subTalukas">Sub-Talukas</button>
            <button class="boundary-chip" data-layer="villages">Village/Panchayat</button>
            <button class="boundary-chip" data-layer="pollingStations">Polling Stations</button>
          </div>
        </div>

        <!-- ROAD TOGGLES -->
        <div style="margin-top: 16px; border-top: 2px solid var(--border-color); padding-top: 12px;">
          <label style="font-size: 10px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.6px;">Roads</label>
          <div class="boundary-toggles" style="margin-top: 8px;" id="road-toggles">
            <button class="boundary-chip" data-layer="stateHighways" style="border-color: #FF5733;">State Highways</button>
            <button class="boundary-chip" data-layer="urbanRoads" style="border-color: #33FF57;">Urban Roads</button>
            <button class="boundary-chip" data-layer="districtRoads" style="border-color: #3357FF;">District Roads</button>
            <button class="boundary-chip" data-layer="villageRoads" style="border-color: #FFD700;">Village Roads</button>
          </div>
        </div>
      </div>
    </div>
  </div>
