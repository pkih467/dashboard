<!-- Add this code to your dashboard HTML file where you want the Field Team and Polling Station cards -->
<div class="card field-team-card">
  <h3>Field Team</h3>
  <label for="assembly-select">Assembly Constituencies:</label>
  <select id="assembly-select">
    <option value="">Select Constituency...</option>
  </select>
  <div id="volunteer-details"></div>
</div>

  <h3>Polling Stations</h3>
  <div id="polling-station-results">
    Select an assembly constituency above to view its polling stations, district, and taluka details.

</div>

document.addEventListener("DOMContentLoaded", () => {
  const select = document.getElementById("assembly-select");
  if (!select) return;

  constituencies.forEach(ac => {
    const opt = document.createElement("option");
    opt.value = ac;
    opt.textContent = ac;
    select.appendChild(opt);
  });

  select.addEventListener("change", (e) => {
    const ac = e.target.value;
    updateDashboardCards(ac);
  });
});

function updateDashboardCards(constituency) {
  const volunteerDiv = document.getElementById("volunteer-details");
  const pollingDiv = document.getElementById("polling-station-results");

  if (!constituency) {
    volunteerDiv.innerHTML = "";
    pollingDiv.innerHTML = "Select an assembly constituency above to view its polling stations, district, and taluka details.";
    return;
  }

  volunteerDiv.innerHTML = `
    <div style="padding: 8px; background: #e9ecef; margin-top: 8px; border-radius: 4px;">
      <strong>Field Team for ${constituency}:</strong>
      <p>Displaying multilevel volunteers (Booth, Mandal, District) for this constituency.</p>
    </div>
  `;

  pollingDiv.innerHTML = `
    <div style="padding: 8px; background: #e2e3e5; margin-top: 8px; border-radius: 4px;">
      <strong>Polling Stations for ${constituency}:</strong>
      <p>Showing all mapped polling booths, talukas, and district boundaries linked to ${constituency}.</p>
    </div>
  `;
}
</script>
