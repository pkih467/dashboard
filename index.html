  <script>
    // ============ OFFLINE DATA MANAGEMENT ============
    const GITHUB_REPO = 'pkih467/peekay';
    const GITHUB_BRANCH = 'main';
    const GITHUB_API = 'https://api.github.com/repos';

    let localData = {
      issues: [],
      teamMembers: [],
      boothAssignments: [],
      campaignNotes: '',
      lastSync: null
    };

    let isOnline = navigator.onLine;
    let pendingSync = [];

    // ============ INITIALIZATION ============
    function initApp() {
      try { loadLocalData(); } catch(e) { console.error('loadLocalData error:', e); }
      try { initMap(); } catch(e) { console.error('initMap error:', e); }
      try { populateDropdowns(); } catch(e) { console.error('populateDropdowns error:', e); }
      try { renderIssues(); } catch(e) { console.error('renderIssues error:', e); }
      try { renderTeamList(); } catch(e) { console.error('renderTeamList error:', e); }
      try { updateOnlineStatus(); } catch(e) { console.error('updateOnlineStatus error:', e); }
      try { loadCampaignNotes(); } catch(e) { console.error('loadCampaignNotes error:', e); }
      window.addEventListener('online', () => { isOnline = true; try { updateOnlineStatus(); } catch(e) {} });
      window.addEventListener('offline', () => { isOnline = false; try { updateOnlineStatus(); } catch(e) {} });
    }

    // Start countdown immediately and run every second
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        updateCountdown();
        setInterval(updateCountdown, 1000);
  
        try {
          initApp();
        } catch(e) {
          console.error('Error in initApp:', e);
        }
      });
    } else {
      updateCountdown();
      setInterval(updateCountdown, 1000);

      try {
        initApp();
      } catch(e) {
        console.error('Error in initApp:', e);
      }
    }

    // ============ LOCAL STORAGE ============
    function loadLocalData() {
      const stored = localStorage.getItem('gujarat_dashboard_v2');
      if (stored) {
        try {
          localData = JSON.parse(stored);
        } catch(e) {
          console.error('Failed to parse stored data', e);
        }
      }
    }

    function saveLocalData() {
      localStorage.setItem('gujarat_dashboard_v2', JSON.stringify(localData));
      if (isOnline) syncData();
    }

    // ============ SYNC LOGIC ============
    async function syncData() {
      if (!isOnline) {
        alert('No internet connection. Changes will sync when online.');
        return;
      }
      try {
        await new Promise(r => setTimeout(r, 1500));
        localData.lastSync = new Date().toISOString();
        localData.issues.forEach(i => i.synced = true);
        localData.teamMembers.forEach(t => t.synced = true);
        saveLocalData();
      } catch(e) {
        console.error('Sync failed:', e);
      }
    }

    // ============ IMPORT/EXPORT ============
    function exportData() {
      const dataStr = JSON.stringify(localData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gujarat_dashboard_export_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData() {
      document.getElementById('importFile').click();
    }

    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          localData = { ...localData, ...imported };
          saveLocalData();
          renderIssues();
          renderTeamList();
          alert('Data imported successfully!');
        } catch(err) {
          alert('Failed to import: Invalid JSON');
        }
      };
      reader.readAsText(file);
    }

    // ============ ONLINE STATUS ============
    function updateOnlineStatus() {
      const indicator = document.getElementById('statusIndicator');
      const text = document.getElementById('statusText');
      if (!indicator || !text) return;
      if (isOnline) {
        indicator.classList.remove('offline');
        indicator.classList.add('online');
        text.innerText = 'Online';
      } else {
        indicator.classList.remove('online');
        indicator.classList.add('offline');
        text.innerText = 'Offline';
      }
    }

    // ============ MAP ============
    let map;
    function initMap() {
      const container = document.getElementById('maplibre-container');
      if (!container) return;

      try {
        map = new maplibregl.Map({
          container: 'maplibre-container',
          style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
          center: [71.1924, 22.2587],
          zoom: 7
        });
      } catch(e) {
        console.warn('Map failed to initialize:', e);
        container.innerHTML = '<div style="padding: 20px; color: var(--text-muted);">Map requires online connection to load tiles.</div>';
      }
    }

    // ============ TABS ============
    function switchTab(index, btn) {
      document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('section-' + index).classList.add('active');
      if (index === 1 && map) setTimeout(() => map.resize(), 200);
    }

    // ============ COUNTDOWN ============
    function updateCountdown() {
      const now = new Date();
      // Month index 11 = December (December 1, 2027)
      const target = new Date(2027, 11, 1, 0, 0, 0);
      let diff = target - now;
      if (diff < 0) diff = 0;

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);

      const pad = (n, w) => String(n).padStart(w, '0');
      
      const dElem = document.getElementById('cd-days');
      const hElem = document.getElementById('cd-hours');
      const mElem = document.getElementById('cd-mins');
      const sElem = document.getElementById('cd-secs');

      if (dElem) dElem.textContent = pad(days, 3);
      if (hElem) hElem.textContent = pad(hours, 2);
      if (mElem) mElem.textContent = pad(mins, 2);
      if (sElem) sElem.textContent = pad(secs, 2);
    }

    // ============ DROPDOWNS ============
    const GujaratFullData = [
      { district: "Kachchh", assembly: "1 - Abdasa", talukas: ["Abdasa", "Lakhpat", "Nakhatrana"] },
      { district: "Kachchh", assembly: "2 - Mandvi", talukas: ["Mandvi", "Mundra"] },
      { district: "Kachchh", assembly: "3 - Bhuj", talukas: ["Bhuj"] },
      { district: "Kachchh", assembly: "4 - Anjar", talukas: ["Anjar"] },
      { district: "Kachchh", assembly: "5 - Gandhidham", talukas: ["Gandhidham"] },
      { district: "Ahmedabad", assembly: "39 - Viramgam", talukas: ["Viramgam", "Mandal"] },
      { district: "Ahmedabad", assembly: "40 - Sanand", talukas: ["Sanand", "Bavla"] },
      { district: "Ahmedabad", assembly: "41 - Ghatlodia", talukas: ["Ahmedabad City"] },
      { district: "Ahmedabad", assembly: "45 - Naranpura", talukas: ["Ahmedabad City"] },
      { district: "Ahmedabad", assembly: "46 - Amraiwadi", talukas: ["Ahmedabad City"] },
      { district: "Surat", assembly: "155 - Olpad", talukas: ["Olpad"] },
      { district: "Surat", assembly: "167 - Surat West", talukas: ["Surat City"] },
      { district: "Bhavnagar", assembly: "98 - Gariadhar", talukas: ["Gariadhar"] },
      { district: "Vadodara", assembly: "135 - Vadodara City", talukas: ["Vadodara City"] }
    ];

    function populateDropdowns() {
      const distSel = document.getElementById('filter-district');
      const acSel = document.getElementById('filter-assembly');
      const boothDistSel = document.getElementById('booth-district');
      const modalDistSel = document.getElementById('modalDistrictSelect');
      const modalAcSel = document.getElementById('modalAcSelect');

      [distSel, boothDistSel, modalDistSel].forEach(sel => {
        if (sel) {
          sel.innerHTML = '<option value="">-- Select --</option>';
          [...new Set(GujaratFullData.map(d => d.district))].sort().forEach(d => sel.innerHTML += `<option value="${d}">${d}</option>`);
        }
      });

      [acSel, modalAcSel].forEach(sel => {
        if (sel) {
          sel.innerHTML = '<option value="">-- Select AC --</option>';
          GujaratFullData.forEach(item => sel.innerHTML += `<option value="${item.assembly}">${item.assembly}</option>`);
        }
      });
    }

    function onModalDistrictChange(districtName) {
      const acSel = document.getElementById('modalAcSelect');
      const talSel = document.getElementById('modalTalukaSelect');
      if (!acSel || !talSel) return;

      acSel.innerHTML = '<option value="">-- Select AC --</option>';
      talSel.innerHTML = '<option value="">-- Select Taluka --</option>';

      if (districtName) {
        GujaratFullData.filter(d => d.district === districtName).forEach(item =>
          acSel.innerHTML += `<option value="${item.assembly}">${item.assembly}</option>`);
      }
    }

    function onModalAcChange(assemblyName) {
      const talSel = document.getElementById('modalTalukaSelect');
      if (!talSel) return;
      talSel.innerHTML = '<option value="">-- Select Taluka --</option>';
      const match = GujaratFullData.find(d => d.assembly === assemblyName);
      if (match && match.talukas) {
        match.talukas.forEach(t => talSel.innerHTML += `<option value="${t}">${t}</option>`);
      }
    }

    function updateBoothFilters() {
      const distSel = document.getElementById('booth-district').value;
      const acSel = document.getElementById('booth-constituency');
      if (!acSel) return;
      acSel.innerHTML = '<option value="">-- Select --</option>';
      if (distSel) {
        GujaratFullData.filter(d => d.district === distSel).forEach(item =>
          acSel.innerHTML += `<option value="${item.assembly}">${item.assembly}</option>`);
      }
    }

    function updateBoothList() {}

    // ============ ISSUES ============
    function openIssueModal() {
      populateDropdowns();
      document.getElementById('issueModalOverlay').style.display = 'flex';
    }

    function closeIssueModal() {
      document.getElementById('issueModalOverlay').style.display = 'none';
    }

    function saveNewIssue() {
      const desc = document.getElementById('modalIssueDesc').value.trim();
      const district = document.getElementById('modalDistrictSelect').value;
      const ac = document.getElementById('modalAcSelect').value;
      const taluka = document.getElementById('modalTalukaSelect').value;
      const geotag = document.getElementById('modalGeoTag').value.trim();
      const level = document.getElementById('modalLevel').value;
      const poc = document.getElementById('modalPoc').value.trim();
      const contact = document.getElementById('modalContact').value.trim();
      const impact = document.getElementById('modalImpact').value;

      if (!desc || !ac) {
        alert('Please provide description and AC.');
        return;
      }

      localData.issues.push({
        id: Date.now(),
        desc, district, ac, taluka, geotag, level, poc, contact, impact,
        date: new Date().toLocaleDateString(),
        synced: false
      });

      saveLocalData();
      closeIssueModal();
      renderIssues();

      document.getElementById('modalIssueDesc').value = '';
      document.getElementById('modalGeoTag').value = '';
      document.getElementById('modalPoc').value = '';
      document.getElementById('modalContact').value = '';
    }

    function renderIssues() {
      const container = document.getElementById('issuesListContainer');
      if (!container) return;
      if (localData.issues.length === 0) {
        container.innerHTML = '<div style="background: rgba(255,255,255,0.6); padding: 14px; border-radius: 12px; font-size: 13px; color: var(--text-muted); text-align: center; font-weight: 600;">No issues recorded yet.</div>';
        return;
      }
      container.innerHTML = localData.issues.map((i, idx) => `
        <div style="background: var(--card-bg); border: 1.5px solid var(--border-color); padding: 12px; border-radius: 12px; margin-bottom: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="font-weight: 800; font-size: 14px; color: var(--text-main);">${i.desc}</div>
            <button onclick="deleteIssue(${idx})" style="background:none; border:none; color:#ff3b30; cursor:pointer; font-weight:700;">Delete</button>
          </div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap;">
            <span>🗳️ ${i.ac}</span>
            <span>📍 ${i.taluka || 'N/A'}</span>
            <span>⚡ <span style="color: ${i.impact === 'Critical' ? 'red' : i.impact === 'High' ? 'orange' : 'green'};">${i.impact}</span></span>
          </div>
          ${i.poc ? `<div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">👤 ${i.poc} (${i.contact})</div>` : ''}
          ${!i.synced ? '<div class="warning-badge">⊘ Not synced</div>' : ''}
        </div>
      `).join('');
    }

    function deleteIssue(idx) {
      localData.issues.splice(idx, 1);
      saveLocalData();
      renderIssues();
    }

    // ============ TEAM MEMBERS ============
    function addTeamMember() {
      const name = prompt('Team member name:');
      if (!name) return;
      const role = prompt('Role (e.g., Field Officer, Coordinator):');
      const area = prompt('Assigned area/constituency:');
      const contact = prompt('Contact number:');

      localData.teamMembers.push({
        id: Date.now(),
        name, role, area, contact,
        status: 'Active',
        synced: false
      });

      saveLocalData();
      renderTeamList();
    }

    function renderTeamList() {
      const container = document.getElementById('teamListContainer');
      if (!container) return;
      if (localData.teamMembers.length === 0) {
        container.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No team members added yet.</td></tr>';
        return;
      }
      container.innerHTML = localData.teamMembers.map((t, idx) => `
        <tr>
          <td><strong>${t.name}</strong></td>
          <td>${t.role}</td>
          <td>${t.area}</td>
          <td>${t.contact}</td>
          <td>${t.status}</td>
        </tr>
      `).join('');
    }

    // ============ NOTES ============
    function loadCampaignNotes() {
      const notesEl = document.getElementById('campaignNotes');
      if (notesEl) notesEl.value = localData.campaignNotes || '';
      const syncTimeEl = document.getElementById('notesSyncTime');
      if (syncTimeEl && localData.lastSync) {
        syncTimeEl.innerText = new Date(localData.lastSync).toLocaleString();
      }
    }

    function saveNotes() {
      const notesEl = document.getElementById('campaignNotes');
      if (notesEl) localData.campaignNotes = notesEl.value;
      saveLocalData();
      const syncTimeEl = document.getElementById('notesSyncTime');
      if (syncTimeEl) syncTimeEl.innerText = 'Just now';
      alert('Notes saved to local storage.');
    }

    // ============ THEME ============
    function toggleTheme() {
      const body = document.body;
      const current = body.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      body.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('theme');
      if (saved) document.body.setAttribute('data-theme', saved);
    });
  </script>
