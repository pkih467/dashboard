        function switchTab(tabId) {
            if (tabId !== 'stateTalukaMap') return;
            const activeContent = document.getElementById('tab-content-stateTalukaMap');
            const activeBtn = document.getElementById('tab-btn-stateTalukaMap');
            if (activeContent) activeContent.classList.remove('hidden');
            if (activeBtn) {
                activeBtn.classList.add('text-white', 'bg-rose-600', 'shadow-md');
                activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
            }
            setTimeout(() => {
                if (mapAC) mapAC.resize();
                if (mapDist) mapDist.resize();
                if (mapTaluka) mapTaluka.resize();
            }, 200);
        }

        // Populate Dropdowns accurately
        function populateDropdowns() {
            // 1. Populate 182 Constituencies
            const acSelect = document.getElementById('map-ac-select');
            let acHtml = '<option value="ALL">All 182 Constituencies</option>';
            all182ACs.forEach(ac => {
                acHtml += `<option value="${ac.name}">${ac.no}. ${ac.name} [${ac.district}]</option>`;
            });
            if (acSelect) acSelect.innerHTML = acHtml;

            // 2. Populate 33 Districts
            const distSelect = document.getElementById('map-district-select');
            let distHtml = '<option value="ALL">All 33 Districts</option>';
            Object.keys(gujaratDistrictTalukas).sort().forEach(dist => {
                distHtml += `<option value="${dist}">${dist}</option>`;
            });
            if (distSelect) distSelect.innerHTML = distHtml;

            // Initialize Talukas as all
            updateTalukaDropdown([]);
        }

        function updateTalukaDropdown(talukas) {
            const talukaSelect = document.getElementById('map-taluka-select');
            let talukaHtml = '<option value="ALL">All Talukas</option>';
            talukas.forEach(t => {
                talukaHtml += `<option value="${t}">${t}</option>`;
            });
            if (talukaSelect) talukaSelect.innerHTML = talukaHtml;
        }

        // 3. Taluka Dropdown Filter Fixed (Reactive based on District selection)
        function filterTalukasByDistrict() {
            const selectedDist = document.getElementById('map-district-select').value;
            if (selectedDist === 'ALL') {
                let allTalukas = [];
                Object.values(gujaratDistrictTalukas).forEach(list => allTalukas.push(...list));
                updateTalukaDropdown([...new Set(allTalukas)].sort());
            } else {
                const talukas = gujaratDistrictTalukas[selectedDist] || [];
                updateTalukaDropdown(talukas.sort());
            }
        }

        // 4. Map Layers Toggle Logic
        function toggleLayer(layerKey) {
            layerStates[layerKey] = !layerStates[layerKey];
            const btn = document.getElementById(`layer-btn-${layerKey}`);
            if (layerStates[layerKey]) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            // Trigger layer visibility update across map views if applicable
        }

        // 5. Layer Reset Button Logic
        function resetLayers() {
            Object.keys(layerStates).forEach(k => {
                layerStates[k] = true;
                const btn = document.getElementById(`layer-btn-${k}`);
                if (btn) btn.classList.add('active');
            });
        }

        function zoomCanvas(type) {
            alert(`Expanding full-screen vector tile view for ${type.toUpperCase()}`);
        }

        function initMaps() {
            mapAC = new maplibregl.Map({
                container: 'map-ac-canvas',
                style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
                center: [72.5714, 23.0225],
                zoom: 7
            });
            mapDist = new maplibregl.Map({
                container: 'map-district-canvas',
                style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
                center: [71.5, 22.8],
                zoom: 6.5
            });
            mapTaluka = new maplibregl.Map({
                container: 'map-taluka-canvas',
                style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
                center: [72.6, 23.1],
                zoom: 7.5
            });

            mapAC.addControl(new maplibregl.NavigationControl(), 'top-right');
            mapDist.addControl(new maplibregl.NavigationControl(), 'top-right');
            mapTaluka.addControl(new maplibregl.NavigationControl(), 'top-right');
        }

        window.onload = () => {
            populateDropdowns();
            initMaps();
            switchTab('stateTalukaMap');
