<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUJARAT 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#e11d48',
                        bjp: '#FF6B00',
                        inc: '#0066FF',
                        aap: '#00C853',
                        oth: '#9C27B0'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MapLibre GL CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <!-- PapaParse for Client-Side CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .locked-tab { opacity: 0.4; cursor: not-allowed !important; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100" id="app-body">

    <!-- Top Command Header -->
    <header class="bg-white/85 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm dark:bg-slate-900/85 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('results')">
                <div class="text-white p-2.5 rounded-2xl font-bold text-lg shadow-md bg-rose-600">
                    <i class="fa-solid fa-flag-chequered"></i>
                </div>
                <div>
                    <h1 class="font-black text-sm tracking-wider bg-gradient-to-r from-slate-900 via-rose-600 to-indigo-600 bg-clip-text text-transparent dark:from-slate-100 dark:to-rose-400">GUJARAT 2027</h1>
                    <p class="text-[11px] text-slate-500 font-medium dark:text-slate-400">Booth-Up Operations & Campaign</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Navigation Bar -->
    <div class="bg-white/75 backdrop-blur border-b border-slate-200 sticky top-[65px] z-40 shadow-sm dark:bg-slate-900/75 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-2 flex items-center space-x-2 overflow-x-auto">
            <button class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-400 locked-tab flex items-center space-x-2 shrink-0">
                <i class="fa-solid fa-house"></i><span>Home</span>
            </button>
            <button onclick="switchTab('stateTalukaMap')" id="tab-btn-stateTalukaMap" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 transition flex items-center space-x-2 shrink-0 border border-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 cursor-pointer">
                <i class="fa-solid fa-map-location-dot text-cyan-500"></i><span>Map</span>
            </button>
            <button onclick="switchTab('results')" id="tab-btn-results" class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 shadow-md transition flex items-center space-x-2 shrink-0 cursor-pointer">
                <i class="fa-solid fa-table-list text-purple-200"></i><span>Results</span>
            </button>
            <button class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-400 locked-tab flex items-center space-x-2 shrink-0">
                <i class="fa-solid fa-users-gear"></i><span>Field Team</span>
            </button>
            <button class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-400 locked-tab flex items-center space-x-2 shrink-0">
                <i class="fa-solid fa-network-wired"></i><span>Central Team</span>
            </button>
            <button class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-400 locked-tab flex items-center space-x-2 shrink-0">
                <i class="fa-solid fa-book-journal-whills"></i><span>Notes</span>
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto p-4 sm:p-6 space-y-6 w-full">

        <!-- TAB 1: Map -->
        <section id="tab-content-stateTalukaMap" class="hidden space-y-6 animate-fadeIn">
            <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm dark:bg-slate-900 dark:border-slate-800 flex flex-wrap gap-4 items-center justify-between">
                <div>
                    <h2 class="font-extrabold text-lg text-slate-800 dark:text-slate-100 flex items-center">
                        <i class="fa-solid fa-map-location-dot text-cyan-500 mr-2"></i>State Map
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">182 ACs, 33 Districts & 248 Talukas</p>
                </div>
                <div class="flex flex-wrap gap-3 items-end">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Assembly Constituency</label>
                        <select id="map-ac-select" class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 text-slate-700 font-semibold cursor-pointer dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200 min-w-[200px]">
                            <option value="ALL">All 182 ACs</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm dark:bg-slate-900 dark:border-slate-800">
                    <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 mb-2">Constituency View</h3>
                    <div id="map-ac-canvas" class="w-full h-[450px] rounded-2xl bg-slate-100 dark:bg-slate-950 overflow-hidden border border-slate-100 dark:border-slate-800"></div>
                </div>
                <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm dark:bg-slate-900 dark:border-slate-800">
                    <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 mb-2">District View</h3>
                    <div id="map-district-canvas" class="w-full h-[450px] rounded-2xl bg-slate-100 dark:bg-slate-950 overflow-hidden border border-slate-100 dark:border-slate-800"></div>
                </div>
                <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm dark:bg-slate-900 dark:border-slate-800">
                    <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 mb-2">Taluka View</h3>
                    <div id="map-taluka-canvas" class="w-full h-[450px] rounded-2xl bg-slate-100 dark:bg-slate-950 overflow-hidden border border-slate-100 dark:border-slate-800"></div>
                </div>
            </div>
        </section>

        <!-- TAB 2: Results -->
        <section id="tab-content-results" class="space-y-6 animate-fadeIn">
            <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm dark:bg-slate-900 dark:border-slate-800 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="font-extrabold text-lg text-slate-800 dark:text-slate-100 flex items-center">
                        <i class="fa-solid fa-table-list text-purple-500 mr-2"></i>3-cycle Results
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Position 1 (Winner) and Position 2 (Runner-up) per constituency</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <select id="results-ac-dropdown" onchange="filterResultsTable()" class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 text-slate-700 font-semibold cursor-pointer dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200 min-w-[240px]">
                        <option value="ALL">All 182 Constituencies (Seat-wise)</option>
                    </select>
                    <select id="results-year-dropdown" onchange="filterResultsTable()" class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 text-slate-700 font-semibold cursor-pointer dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200">
                        <option value="2022">2022 General Election</option>
                        <option value="2017">2017 General Election</option>
                        <option value="2012">2012 General Election</option>
                    </select>
                </div>
            </div>

            <!-- Dynamic Table Container -->
            <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm dark:bg-slate-900 dark:border-slate-800">
                <div class="overflow-x-auto max-h-[600px] p-2">
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead id="results-table-thead" class="sticky top-0 z-10"></thead>
                        <tbody class="divide-y divide-slate-100 dark:divide-slate-800" id="results-csv-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 text-center py-4 text-xs text-slate-500 mt-auto dark:bg-slate-900 dark:border-slate-800 dark:text-slate-400 font-medium">
        strictly confidential, not for distribution
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let parsedResultsDataset = [];
        let mapAC, mapDist, mapTaluka;

        function switchTab(tabId) {
            if (tabId !== 'stateTalukaMap' && tabId !== 'results') {
                alert('This tab is locked.');
                return;
            }
            ['stateTalukaMap', 'results'].forEach(t => {
                const content = document.getElementById('tab-content-' + t);
                const btn = document.getElementById('tab-btn-' + t);
                if (content) content.classList.add('hidden');
                if (btn) {
                    btn.classList.remove('text-white', 'bg-rose-600', 'shadow-md');
                    btn.classList.add('bg-slate-100', 'text-slate-600', 'dark:bg-slate-800', 'dark:text-slate-300');
                }
            });
            const activeContent = document.getElementById('tab-content-' + tabId);
            const activeBtn = document.getElementById('tab-btn-' + tabId);
            if (activeContent) activeContent.classList.remove('hidden');
            if (activeBtn) {
                activeBtn.classList.add('text-white', 'bg-rose-600', 'shadow-md');
                activeBtn.classList.remove('bg-slate-100', 'text-slate-600', 'dark:bg-slate-800', 'dark:text-slate-300');
            }
            if (tabId === 'results') {
                filterResultsTable();
            }
            if (tabId === 'stateTalukaMap') {
                setTimeout(() => { mapAC && mapAC.resize(); }, 200);
            }
        }

        // Cycle Configurations with multi-path resolution
        const cycleSources = [
            { year: 2022, paths: ['AE_Gujarat_2022.csv', './AE_Gujarat_2022.csv', 'AE_Gujarat 2022.csv'] },
            { year: 2017, paths: ['AE_Gujarat_2017.csv', './AE_Gujarat_2017.csv', 'AE_Gujarat 2017.csv'] },
            { year: 2012, paths: ['AE_Gujarat_2012.csv', './AE_Gujarat_2012.csv', 'AE_Gujarat 2012.csv'] }
        ];

        async function fetchCSVContent(item) {
            for (const p of item.paths) {
                try {
                    const res = await fetch(p);
                    if (res.ok) {
                        const txt = await res.text();
                        return { year: item.year, text: txt };
                    }
                } catch (e) {}
            }
            return null;
        }

        async function initializeData() {
            parsedResultsDataset = [];
            const fetched = await Promise.all(cycleSources.map(fetchCSVContent));

            fetched.forEach(item => {
                if (item && item.text) {
                    Papa.parse(item.text, {
                        header: true,
                        dynamicTyping: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            if (results && results.data) {
                                results.data.forEach(row => {
                                    // Normalize Year
                                    if (!row.Year && !row.year) row.Year = item.year;
                                    parsedResultsDataset.push(row);
                                });
                            }
                        }
                    });
                }
            });

            populateACDropdown();
            filterResultsTable();
        }

        function getField(row, keys) {
            for (let k of keys) {
                if (row[k] !== undefined && row[k] !== null) return row[k];
            }
            // Case-insensitive fallback
            const lowerKeys = Object.keys(row).map(x => x.toLowerCase());
            for (let k of keys) {
                const idx = lowerKeys.indexOf(k.toLowerCase());
                if (idx !== -1) return row[Object.keys(row)[idx]];
            }
            return null;
        }

        function populateACDropdown() {
            const acMap = new Map();

            parsedResultsDataset.forEach(r => {
                const no = getField(r, ['Assembly_No', 'Constituency_No', 'AC_NO', 'ac_no', 'AC_No']);
                const name = getField(r, ['Constituency_Name', 'Constituency', 'AC_NAME', 'ac_name', 'AC_Name']);

                if (name) {
                    const cleanName = String(name).trim();
                    if (!acMap.has(cleanName)) {
                        acMap.set(cleanName, Number(no) || 0);
                    }
                }
            });

            const acDropdown = document.getElementById('results-ac-dropdown');
            const mapDropdown = document.getElementById('map-ac-select');

            let optionsHtml = '<option value="ALL">All 182 Constituencies (Seat-wise)</option>';
            Array.from(acMap.entries())
                .sort((a, b) => {
                    if (a[1] && b[1] && a[1] !== b[1]) return a[1] - b[1];
                    return a[0].localeCompare(b[0]);
                })
                .forEach(([name, no]) => {
                    const label = no ? `${no}. ${name}` : name;
                    optionsHtml += `<option value="${name}">${label}</option>`;
                });

            if (acDropdown) acDropdown.innerHTML = optionsHtml;
            if (mapDropdown) mapDropdown.innerHTML = optionsHtml;
        }

        function filterResultsTable() {
            const acDropdown = document.getElementById('results-ac-dropdown');
            const yearDropdown = document.getElementById('results-year-dropdown');
            const thead = document.getElementById('results-table-thead');
            const tbody = document.getElementById('results-csv-tbody');

            if (!acDropdown || !yearDropdown || !thead || !tbody) return;

            const selectedYear = Number(yearDropdown.value);
            const selectedAc = acDropdown.value;

            // Filter strictly for selected Year & Position 1 and 2
            let filtered = parsedResultsDataset.filter(r => {
                const rowYear = Number(getField(r, ['Year', 'year']) || 0);
                const pos = Number(getField(r, ['Position', 'position', 'POS', 'pos', 'Rank']) || 0);
                return rowYear === selectedYear && (pos === 1 || pos === 2);
            });

            if (selectedAc !== 'ALL') {
                filtered = filtered.filter(r => {
                    const name = String(getField(r, ['Constituency_Name', 'Constituency', 'AC_NAME', 'ac_name']) || '').trim().toLowerCase();
                    return name === selectedAc.trim().toLowerCase();
                });
            }

            if (filtered.length === 0) {
                thead.innerHTML = `<tr class="bg-slate-100 text-slate-600"><th class="p-3">Status</th></tr>`;
                tbody.innerHTML = `<tr><td class="p-4 text-slate-500">No records found for this election cycle or dataset loading...</td></tr>`;
                return;
            }

            // Sort: Assembly No ascending, Position ascending (1 then 2)
            filtered.sort((a, b) => {
                const noA = Number(getField(a, ['Assembly_No', 'Constituency_No', 'AC_NO', 'ac_no']) || 0);
                const noB = Number(getField(b, ['Assembly_No', 'Constituency_No', 'AC_NO', 'ac_no']) || 0);
                const posA = Number(getField(a, ['Position', 'position', 'POS', 'pos']) || 0);
                const posB = Number(getField(b, ['Position', 'position', 'POS', 'pos']) || 0);

                if (noA !== noB) return noA - noB;
                return posA - posB;
            });

            // Dynamically render all CSV columns
            const columns = Object.keys(filtered[0]);
            let theadHTML = `<tr class="bg-slate-100 text-slate-700 uppercase font-bold border-b border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700">`;
            columns.forEach(col => {
                theadHTML += `<th class="p-3">${col.replace(/_/g, ' ')}</th>`;
            });
            theadHTML += `</tr>`;
            thead.innerHTML = theadHTML;

            tbody.innerHTML = '';
            filtered.forEach(r => {
                const tr = document.createElement('tr');
                const pos = Number(getField(r, ['Position', 'position', 'POS', 'pos']) || 0);
                if (pos === 1) {
                    tr.className = "bg-rose-50/40 dark:bg-rose-950/20 font-semibold";
                }
                let rowHTML = '';
                columns.forEach(col => {
                    const val = r[col] !== undefined && r[col] !== null ? r[col] : '';
                    rowHTML += `<td class="p-3 font-medium">${val}</td>`;
                });
                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        function initMaps() {
            mapAC = new maplibregl.Map({ container: 'map-ac-canvas', style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json', center: [72.5714, 23.0225], zoom: 7 });
            mapDist = new maplibregl.Map({ container: 'map-district-canvas', style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json', center: [71.5, 22.8], zoom: 6.5 });
            mapTaluka = new maplibregl.Map({ container: 'map-taluka-canvas', style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json', center: [72.6, 23.1], zoom: 7.5 });
        }

        window.onload = async () => {
            initMaps();
            await initializeData();
            switchTab('results');
        };
    </script>
</body>
</html>
