<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Atlas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-red: #f43f5e;
            --accent-yellow: #fbbf24;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; gap: 16px; }
        h1 { font-size: 1.5rem; color: var(--accent-blue); letter-spacing: 0.5px; }
        .map-layer-label { background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-left: 10px; border: 1px solid rgba(56, 189, 248, 0.3); }
        .controls { display: flex; gap: 12px; flex-wrap: wrap; }
        select, input { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; outline: none; }
        select:focus, input:focus { border-color: var(--accent-blue); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card h3 { font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .card .value { font-size: 1.5rem; font-weight: bold; }
        .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        th { background: #111827; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        tr:hover { background: rgba(56, 189, 248, 0.05); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-helped { background: rgba(52, 211, 153, 0.2); color: #34d399; }
        .badge-partial { background: rgba(251, 191, 36, 0.2); color: var(--accent-yellow); }
        .badge-refused { background: rgba(244, 63, 94, 0.2); color: var(--accent-red); }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>India Atlas <span class="map-layer-label">INDIA MAP</span></h1>
        </div>
        <div class="controls">
            <select id="deptFilter" onchange="filterData()">
                <option value="">All Departments</option>
                <option value="revenue">Revenue / Land Records</option>
                <option value="rto">RTO</option>
                <option value="police">Police</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search city, state, or role..." onkeyup="filterData()">
        </div>
    </header>

    <div class="grid">
        <div class="card">
            <h3>Total Records Logged</h3>
            <div class="value" id="totalReports">4</div>
        </div>
        <div class="card">
            <h3>Total Amount Tracked</h3>
            <div class="value" id="totalAmount">₹33,000</div>
        </div>
        <div class="card">
            <h3>Administrative Coverage</h3>
            <div class="value">4 States / Cities</div>
        </div>
    </div>

    <div class="table-container">
        <table id="reportsTable">
            <thead>
                <tr>
                    <th>Reported Date</th>
                    <th>Location (City, State)</th>
                    <th>Department</th>
                    <th>Official Role</th>
                    <th>Report Type</th>
                    <th>Amount</th>
                    <th>Outcome</th>
                    <th>Notes / Remarks</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>

    <script>
        const rawData = [
            {
                "city": "Pune",
                "state": "Maharashtra",
                "department_slug": "police",
                "department_name": "Police",
                "official_role": "Towing Vehicle",
                "report_type": "inspection",
                "amount": 0,
                "currency": "INR",
                "reported_on": "2026-08-16",
                "outcome": "helped",
                "note": "Vehicle cleared successfully"
            },
            {
                "id": "76426c2e-1df6-4a5e-8cb9-795b653731ce",
                "reported_on": "2026-08-16",
                "department_slug": "revenue",
                "department_name": "Revenue / Land Records",
                "report_type": "bribe_paid",
                "amount": 30000,
                "currency": "INR",
                "mode": "cash",
                "city": "Bengaluru",
                "state": "Karnataka",
                "official_role": "Registrar",
                "outcome": "partial",
                "official_fee": 0,
                "note": "Registrar delayed file clearance"
            },
            {
                "id": "23f6c7b2-b90f-47e0-a79e-0f8da52209b9",
                "reported_on": "2026-08-16",
                "department_slug": "rto",
                "department_name": "RTO",
                "report_type": "bribe_paid",
                "amount": 3000,
                "currency": "INR",
                "mode": "cash",
                "city": "Bijapur",
                "state": "Karnataka",
                "official_role": "Officer",
                "outcome": "helped",
                "official_fee": 0,
                "note": "Kept rejecting file until resolved"
            },
            {
                "id": "1aec7e95-5325-43c5-a12a-4e5e4e83d6b9",
                "reported_on": "2026-08-16",
                "department_slug": "police",
                "department_name": "Police",
                "report_type": "refused",
                "amount": 0,
                "currency": "INR",
                "mode": "cash",
                "city": "Gurugram",
                "state": "Haryana",
                "official_role": "Constable",
                "outcome": "refused",
                "official_fee": 0,
                "note": "Refused extra-official payment"
            }
        ];

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                const tr = document.createElement('tr');
                let badgeClass = 'badge-helped';
                if(item.outcome === 'partial') badgeClass = 'badge-partial';
                if(item.outcome === 'refused') badgeClass = 'badge-refused';

                tr.innerHTML = `
                    <td>${item.reported_on}</td>
                    <td>${item.city}, ${item.state}</td>
                    <td>${item.department_name}</td>
                    <td>${item.official_role}</td>
                    <td>${item.report_type}</td>
                    <td>₹${item.amount.toLocaleString()}</td>
                    <td><span class="badge ${badgeClass}">${item.outcome}</span></td>
                    <td>${item.note || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const dept = document.getElementById('deptFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filtered = rawData.filter(item => {
                const matchesDept = !dept || item.department_slug === dept;
                const matchesSearch = !search || 
                    item.city.toLowerCase().includes(search) || 
                    item.state.toLowerCase().includes(search) || 
                    item.official_role.toLowerCase().includes(search);
                return matchesDept && matchesSearch;
            });

            renderTable(filtered);
        }

        // Initialize table
        renderTable(rawData);
    </script>
</body>
</html>
